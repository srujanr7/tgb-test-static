<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Countdown Timer</title>
<style>
:root{--bg:#f4f1ea;--fg:#1d2a1f;--muted:#6b7a6d;--accent:#2f7a4a;--card:#fffdf8;--line:#ddd6c8}
@media (prefers-color-scheme:dark){:root{--bg:#121714;--fg:#e8efe9;--muted:#93a596;--accent:#5cc287;--card:#1a211c;--line:#2a332d}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:32px 28px;width:100%;max-width:420px;text-align:center}
h1{margin:0 0 4px;font-size:1.1rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600}
.display{font-variant-numeric:tabular-nums;font-size:clamp(3rem,15vw,4.5rem);font-weight:700;margin:16px 0 20px;line-height:1}
.display.done{color:var(--accent);animation:pulse 1s ease-in-out 3}
@keyframes pulse{50%{opacity:.35}}
.inputs{display:flex;gap:10px;justify-content:center;margin-bottom:22px}
.inputs label{display:flex;flex-direction:column;font-size:.75rem;color:var(--muted);gap:4px}
.inputs input{width:80px;padding:10px;font-size:1.1rem;text-align:center;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
.inputs input:disabled{opacity:.5}
.buttons{display:flex;gap:10px}
button{flex:1;padding:12px;font-size:1rem;font-weight:600;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.4;cursor:not-allowed}
.status{margin-top:16px;font-size:.9rem;color:var(--muted);min-height:1.2em}
</style>
</head>
<body>
<main class="card">
<h1>Countdown Timer</h1>
<div class="display" id="display">05:00</div>
<div class="inputs">
<label>Minutes<input id="min" type="number" min="0" max="999" value="5"></label>
<label>Seconds<input id="sec" type="number" min="0" max="59" value="0"></label>
</div>
<div class="buttons">
<button class="primary" id="start">Start</button>
<button id="pause" disabled>Pause</button>
<button id="reset">Reset</button>
</div>
<div class="status" id="status"></div>
</main>
<script>
const $=id=>document.getElementById(id);
const display=$('display'),minI=$('min'),secI=$('sec'),startB=$('start'),pauseB=$('pause'),resetB=$('reset'),status=$('status');
let remaining=0,endAt=0,tick=null,running=false;
const fmt=ms=>{const t=Math.ceil(ms/1000),m=Math.floor(t/60),s=t%60;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')};
const fromInputs=()=>((Math.max(0,parseInt(minI.value)||0)*60)+Math.min(59,Math.max(0,parseInt(secI.value)||0)))*1000;
function render(){display.textContent=fmt(remaining);document.title=(running?fmt(remaining)+' · ':'')+'Countdown Timer'}
function setInputs(on){minI.disabled=secI.disabled=!on}
function start(){
 if(running)return;
 if(remaining<=0)remaining=fromInputs();
 if(remaining<=0){status.textContent='Set a time first.';return}
 display.classList.remove('done');
 running=true;endAt=Date.now()+remaining;
 startB.disabled=true;pauseB.disabled=false;setInputs(false);status.textContent='Running';
 tick=setInterval(()=>{remaining=Math.max(0,endAt-Date.now());render();if(remaining===0)finish()},200);
 render();
}
function pause(){
 if(!running)return;
 clearInterval(tick);running=false;remaining=Math.max(0,endAt-Date.now());
 startB.disabled=false;startB.textContent='Resume';pauseB.disabled=true;status.textContent='Paused';render();
}
function reset(){
 clearInterval(tick);running=false;remaining=fromInputs();
 startB.disabled=false;startB.textContent='Start';pauseB.disabled=true;setInputs(true);status.textContent='';
 display.classList.remove('done');render();remaining=0;display.textContent=fmt(fromInputs());
}
function finish(){
 clearInterval(tick);running=false;remaining=0;
 startB.disabled=false;startB.textContent='Start';pauseB.disabled=true;setInputs(true);
 display.classList.add('done');status.textContent="Time's up!";document.title="Time's up! · Countdown Timer";
 try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=880;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.2,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+1);o.start();o.stop(a.currentTime+1)}catch(e){}
}
minI.addEventListener('input',()=>{if(!running&&startB.textContent==='Start')display.textContent=fmt(fromInputs())});
secI.addEventListener('input',()=>{if(!running&&startB.textContent==='Start')display.textContent=fmt(fromInputs())});
startB.onclick=start;pauseB.onclick=pause;resetB.onclick=reset;
display.textContent=fmt(fromInputs());
</script>
</body>
</html>
